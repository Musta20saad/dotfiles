# ~/.config/picom/picom.conf  (smooth profile: no blur, snappy fades)
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

# rounded windows
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# quick fades (about 60 ms)
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 5;

# lighter shadows
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# dim unfocused windows so you can see which one is active
inactive-opacity = 0.88;
frame-opacity = 1.0;
focus-exclude = [ "class_g = 'Polybar'" ];

wintypes:
{
  dock = { shadow = false; };
  tooltip = { fade = true; shadow = true; opacity = 0.95; };
};
