[colors]
bg = #E60F1A2B
fg = #E6F1FF
dim = #7C93AD
sky = #7DD3FC
blue = #60A5FA
indigo = #A5B4FC
yellow = #FDE68A
red = #F87171
border = #407DD3FC

[bar/main]
width = 100%:-24
offset-x = 12
offset-y = 1
height = 32
radius = 16
background = ${colors.bg}
foreground = ${colors.fg}
border-size = 1
border-color = ${colors.border}
line-size = 2
font-0 = "DejaVu Sans Mono:size=10;2"
font-1 = "FontAwesome:size=11;2"
padding = 2
module-margin = 1
wm-restack = i3
override-redirect = true
enable-ipc = true
cursor-click = pointer
modules-left = workspaces
modules-center = date
modules-right = cpu memory updates bluetooth wifi volume brightness battery

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = ${colors.yellow}
label-focused = %name%
label-focused-foreground = ${colors.sky}
label-focused-background = #267DD3FC
label-focused-underline = ${colors.sky}
label-focused-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 2
label-visible = %name%
label-visible-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 85
format-prefix = "CPU "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%
format-warn-prefix = "CPU "
format-warn-prefix-foreground = ${colors.red}
label-warn = %percentage:2%%
label-warn-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 85
format-prefix = "RAM "
format-prefix-foreground = ${colors.indigo}
label = %percentage_used:2%%
format-warn-prefix = "RAM "
format-warn-prefix-foreground = ${colors.red}
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.red}

[module/disk]
type = internal/fs
interval = 30
mount-0 = /
format-mounted-prefix = "SSD "
format-mounted-prefix-foreground = ${colors.sky}
label-mounted = %free%
format-unmounted =

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %I:%M %p
label = %date%  %{F#7DD3FC}%time%%{F-}

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
click-left = ~/.config/polybar/scripts/bt-menu.sh

[module/wifi]
type = custom/script
exec = ~/.config/polybar/scripts/wifi.sh
interval = 5
click-left = ~/.config/polybar/scripts/wifi-menu.sh

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
tail = true

[settings]
screenchange-reload = true

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
tail = true
click-left = pavucontrol
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/brightness]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/brightness.sh
initial = 1
scroll-up = ~/.config/polybar/scripts/bright.sh up
scroll-down = ~/.config/polybar/scripts/bright.sh down

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.py
tail = true

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 10
click-left = mintupdate-launcher || mintupdate
click-right = rm -f /tmp/.polybar-updates

